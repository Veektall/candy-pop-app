name: Build APK
on:
  push:
    paths: ["app/**"]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: "17" }
      - name: Build
        run: |
          set -a; source app/app.env; set +a
          bash build.sh app/index.html "$APP_NAME" "$APP_PACKAGE"
          cp "out/$APP_NAME.apk" "out/app.apk"
      - uses: actions/upload-artifact@v4
        with: { name: apk, path: out/*.apk }
      - name: Publish download link
        env: { GH_TOKEN: "${{ github.token }}" }
        run: |
          gh release delete latest -y --cleanup-tag || true
          gh release create latest out/*.apk --title "Latest APK" --notes "Built from app/index.html"
